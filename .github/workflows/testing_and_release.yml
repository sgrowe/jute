# Generated from [docs/specs/ci_cd_flow.md](../../docs/specs/ci_cd_flow.md)

name: Testing and Release

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert tag matches Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    name: build (${{ matrix.name }})
    needs: check-version
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runs-on: macos-14
            target: aarch64-apple-darwin
            artifact-file: jute-macos-aarch64
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact-file: jute-linux-x86_64
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact-file: jute-linux-aarch64
    runs-on: ${{ matrix.runs-on }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Ensure rustfmt/clippy are installed
        run: rustup component add rustfmt clippy

      - name: Install musl toolchain
        if: matrix.name != 'macos'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: mkdir -p dist

      - name: Build + test
        run: cargo run --release --target ${{ matrix.target }} -- test

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/jute dist/${{ matrix.artifact-file }}

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  report:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Build size table
        run: |
          set -euo pipefail
          {
            echo "| Binary | Size |"
            echo "|---|---|"
            total=0
            for f in dist/*; do
              size=$(stat --format=%s "$f")
              total=$((total + size))
              echo "| $(basename "$f") | $(numfmt --to=iec-i --suffix=B "$size") |"
            done
            echo "| **Total** | $(numfmt --to=iec-i --suffix=B "$total") |"
          } | tee release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    needs: report
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
